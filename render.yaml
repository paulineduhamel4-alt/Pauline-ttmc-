services:
  - type: web
    name: ttmc
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: APP_PIN
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-haiku-4-5-20251001
    autoDeploy: true
