services:
  - type: web
    name: ttmc
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: APP_PIN
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEN_CONCURRENCY
        value: "8"
    autoDeploy: true
